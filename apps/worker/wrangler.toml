# StayPut: one Worker serves the React app (static assets) and the API on the same origin, so
# that Whop's iframe token reaches /api (DECISIONS.md, 2026-09-30).
name = "stayput"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
# These paths run the Worker; every other path is a file of the React build (or index.html).
run_worker_first = ["/api/*", "/auth/*", "/webhooks/*", "/health", "/badge/*", "/verify/*", "/v/*", "/privacy", "/terms", "/dpa"]

[vars]
# "sandbox" until the switch to production (SPEC, rule 4).
WHOP_ENV = "sandbox"
# The Whop app (not a secret): StayPut in the sandbox, created on 2026-09-30 (README.md). At the
# switch to production, the repository variables WHOP_ENV and WHOP_APP_ID replace both values.
WHOP_APP_ID = "app_rjFkp2xKgjfPxY"
# The member space (goals, results, testimonial cards, buddies, rescue challenges) is off in V1
# (decision of 2026-10-02): "true" turns it back on. The departure survey always runs.
MEMBER_SPACE_ENABLED = "false"
# The operator's own community, whose team sees StayPut's internal status page (SPEC Phase 8.5):
# « StayPut Test » in the sandbox. At the switch to production, the repository variable
# OPERATOR_COMPANY_ID replaces it (a community's id, not a secret).
OPERATOR_COMPANY_ID = "biz_2whAzkbCRpcGqQ"

# Secrets, never in this file: `npx wrangler secret put WHOP_API_KEY` and
# `npx wrangler secret put WHOP_WEBHOOK_SECRET` (README.md, Deployment). Optional modules:
# DISCORD_BOT_TOKEN and DISCORD_CLIENT_SECRET (Discord), TELEGRAM_BOT_TOKEN (Telegram).

# The database, through Hyperdrive: added at the first deployment, once the Hyperdrive
# configuration exists (README.md). Without it the Worker runs, database features off.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<id printed by npx wrangler hyperdrive create>"

# Cloudflare runs the Worker where a request is answered fastest (Smart Placement): a screen
# of the dashboard reads the database several times while the browser waits once, so near
# the database (Europe) rather than near whoever called, Whop's relay included. Static files
# are served from the nearest data center whatever this says. /health tells where it ran.
[placement]
mode = "smart"

[triggers]
# One trigger: Cloudflare's free plan allows 5 per account, and the account runs the sandbox's
# Worker and production's. Each tick runs the jobs its time names (src/cron.ts, groupAt): the
# hourly work on the hour, a slice of the synchronization with Whop at 5, 15, …, 55 past, the
# weekly analyses on Monday 07:30 UTC.
crons = ["*/5 * * * *"]

[observability]
enabled = true
