<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050607" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/logo-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StayPut</title>
  </head>
  <body>
    <!-- StayPut's loading screen, drawn before any JavaScript (src/boot.tsx takes it away). -->
    <div id="boot" role="status">
      <div class="boot-spinner">
        <svg class="boot-ring" viewBox="0 0 72 72" aria-hidden="true">
          <circle class="boot-ring-track" cx="36" cy="36" r="34" />
          <circle class="boot-ring-arc" cx="36" cy="36" r="34" />
        </svg>
        <img class="boot-mark" src="/logo-boot.webp" width="44" height="44" alt="" />
      </div>
      <p class="boot-label">Loading StayPut…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
