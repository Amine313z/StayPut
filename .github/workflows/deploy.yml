name: Deploy

# Started by hand: GitHub -> Actions -> Deploy -> Run workflow (or by Claude through the API).
# Every value comes from the repository's secrets and variables (README.md, Deployment).
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

      # Also writes the cleaned CLOUDFLARE_ACCOUNT_ID to $GITHUB_ENV for the next steps (the
      # secret may hold a dashboard address around the id).
      - name: Check the configuration and prepare the Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          WHOP_APP_ID: ${{ vars.WHOP_APP_ID }}
        run: npx tsx scripts/deploy/prepare.ts "$RUNNER_TEMP/secrets.json"

      - name: Apply the database migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate

      - name: Connect the Worker to the database (Hyperdrive)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx tsx scripts/deploy/hyperdrive.ts apps/worker/wrangler.toml

      - run: npm run build

      - name: Publish the Worker
        working-directory: apps/worker
        env:
          WHOP_APP_ID: ${{ vars.WHOP_APP_ID }}
          WHOP_ENV: ${{ vars.WHOP_ENV || 'sandbox' }}
        run: |
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" \
            --var "WHOP_ENV:$WHOP_ENV" --var "WHOP_APP_ID:$WHOP_APP_ID" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Check the deployed Worker
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          echo "StayPut: $url"
          health=$(curl -sS --retry 6 --retry-all-errors --retry-delay 5 "$url/health")
          echo "$health"
          {
            echo "### StayPut is live"
            echo ""
            echo "- URL: $url"
            echo "- Health: \`$health\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$health" | grep -q '"status":"ok"'
