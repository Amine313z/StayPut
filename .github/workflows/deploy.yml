name: Deploy

# Started by hand: GitHub -> Actions -> Deploy -> Run workflow (or by Claude through the API).
# Every value comes from the repository's secrets and variables (README.md, Deployment).
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

      # Also writes the cleaned CLOUDFLARE_ACCOUNT_ID to $GITHUB_ENV for the next steps (the
      # secret may hold a dashboard address around the id).
      - name: Check the configuration and prepare the Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_WEBHOOK_SECRET: ${{ secrets.WHOP_WEBHOOK_SECRET }}
          WHOP_ENV: ${{ vars.WHOP_ENV }}
          WHOP_APP_ID: ${{ vars.WHOP_APP_ID }}
        run: npx tsx scripts/deploy/prepare.ts "$RUNNER_TEMP/secrets.json"

      - name: Apply the database migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate

      - name: Connect the Worker to the database (Hyperdrive)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx tsx scripts/deploy/hyperdrive.ts apps/worker/wrangler.toml

      - run: npm run build

      # WHOP_ENV and WHOP_APP_ID come from wrangler.toml (the sandbox app) unless the repository
      # variables of the same name are set (production).
      - name: Publish the Worker
        working-directory: apps/worker
        env:
          WHOP_APP_ID: ${{ vars.WHOP_APP_ID }}
          WHOP_ENV: ${{ vars.WHOP_ENV }}
        run: |
          overrides=()
          if [ -n "$WHOP_ENV" ]; then overrides+=(--var "WHOP_ENV:$WHOP_ENV"); fi
          if [ -n "$WHOP_APP_ID" ]; then overrides+=(--var "WHOP_APP_ID:$WHOP_APP_ID"); fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" "${overrides[@]}" |
            tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secrets.json"

      # A new workers.dev address can answer 404 "error code: 1042", then nothing, before requests
      # reach the Worker (about 8 minutes for StayPut's first deployment): keep asking for up to 3
      # minutes, then re-run the workflow if the address is still coming up.
      - name: Check the deployed Worker
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no workers.dev address"
            exit 1
          fi
          echo "StayPut: $url"
          body_file="$RUNNER_TEMP/health.json"
          for attempt in $(seq 1 18); do
            rm -f "$body_file"
            code=$(curl -sS -o "$body_file" -w '%{http_code}' --max-time 15 "$url/health") || true
            body=$(cat "$body_file" 2>/dev/null || true)
            echo "Attempt $attempt: HTTP $code $body"
            if grep -q '"status":"ok"' "$body_file" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          {
            echo "### StayPut"
            echo ""
            echo "- URL: $url"
            echo "- /health: HTTP $code \`$body\`"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '"status":"ok"' "$body_file"
