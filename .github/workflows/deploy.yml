name: Deploy

# Started by hand: GitHub -> Actions -> Deploy -> Run workflow (or by Claude through the API).
# Two targets (docs/production.md): the sandbox Worker « stayput », with the repository's secrets
# and variables (README.md, Deployment), and the production Worker « stayput-app ». Production
# reads its own values under PRODUCTION_<name> (scripts/deploy/prepare.ts, PRODUCTION_OWN): one
# missing stops the deployment, never replaced by the sandbox's. Cloudflare and Discord are shared.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [sandbox, production]
        default: sandbox

concurrency:
  group: deploy-${{ inputs.target || 'sandbox' }}
  cancel-in-progress: false

# The token GitHub gives the run reads the code, and writes nothing on GitHub.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Production's settings live in the GitHub environment « production stayput off » (the
    # founder's name, 2026-10-07), with its required reviewer: a production run waits for them.
    environment: ${{ inputs.target == 'production' && 'production stayput off' || 'sandbox' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STAYPUT_TARGET: ${{ inputs.target || 'sandbox' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

      # Also writes the cleaned CLOUDFLARE_ACCOUNT_ID to $GITHUB_ENV for the next steps (the
      # secret may hold a dashboard address around the id).
      - name: Check the configuration and prepare the Worker secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_DB_URL: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_SUPABASE_DB_URL' || 'SUPABASE_DB_URL'] }}
          WHOP_API_KEY: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_API_KEY' || 'WHOP_API_KEY'] }}
          WHOP_WEBHOOK_SECRET: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_WEBHOOK_SECRET' || 'WHOP_WEBHOOK_SECRET'] }}
          # Optional modules: Discord (both) and Telegram, each off until its secrets exist.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_TELEGRAM_BOT_TOKEN' || 'TELEGRAM_BOT_TOKEN'] }}
          WHOP_ENV: ${{ inputs.target == 'production' && 'production' || vars.WHOP_ENV }}
          WHOP_APP_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_WHOP_APP_ID' || 'WHOP_APP_ID'] }}
          OPERATOR_COMPANY_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_OPERATOR_COMPANY_ID' || 'OPERATOR_COMPANY_ID'] }}
        run: npx tsx scripts/deploy/prepare.ts "$RUNNER_TEMP/secrets.json"

      # A key copied wrong stops here, before anything changes (Whop answers 401 to it).
      - name: Ask Whop whether it accepts the app key
        env:
          WHOP_API_KEY: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_API_KEY' || 'WHOP_API_KEY'] }}
          WHOP_ENV: ${{ inputs.target == 'production' && 'production' || vars.WHOP_ENV }}
        run: npx tsx scripts/deploy/check-whop.ts apps/worker/wrangler.toml

      # The app's views and permissions as Whop holds them (scripts/deploy/check-app.ts): a path
      # typed wrong in Whop's dashboard stops a production deployment here, before anything
      # changes. The sandbox only reports.
      - name: Read the Whop app's settings
        env:
          WHOP_API_KEY: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_API_KEY' || 'WHOP_API_KEY'] }}
          WHOP_ENV: ${{ inputs.target == 'production' && 'production' || vars.WHOP_ENV }}
          WHOP_APP_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_WHOP_APP_ID' || 'WHOP_APP_ID'] }}
        run: npx tsx scripts/deploy/check-app.ts settings apps/worker/wrangler.toml

      # Also claims the database for this deployment, or stops when the other one claimed it
      # (scripts/deploy/claim.ts): one database, one deployment.
      - name: Apply the database migrations
        env:
          DATABASE_URL: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_SUPABASE_DB_URL' || 'SUPABASE_DB_URL'] }}
        run: npm run db:migrate

      - name: Connect the Worker to the database (Hyperdrive)
        env:
          SUPABASE_DB_URL: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_SUPABASE_DB_URL' || 'SUPABASE_DB_URL'] }}
        run: npx tsx scripts/deploy/hyperdrive.ts apps/worker/wrangler.toml

      # Satoshi's license forbids passing its files on and this repository is public: the font is
      # downloaded from Fontshare here and served with the app (scripts/deploy/satoshi.ts).
      - name: Fetch the Satoshi font from Fontshare
        run: npx tsx scripts/deploy/satoshi.ts apps/web/public

      - run: npm run build

      # WHOP_ENV, WHOP_APP_ID and OPERATOR_COMPANY_ID come from wrangler.toml (the sandbox) unless
      # the variables are set (always for production, checked above). Production is its own
      # Worker, « stayput-app », beside the sandbox's « stayput ».
      - name: Publish the Worker
        id: publish
        working-directory: apps/worker
        env:
          WHOP_APP_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_WHOP_APP_ID' || 'WHOP_APP_ID'] }}
          WHOP_ENV: ${{ inputs.target == 'production' && 'production' || vars.WHOP_ENV }}
          OPERATOR_COMPANY_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_OPERATOR_COMPANY_ID' || 'OPERATOR_COMPANY_ID'] }}
        run: |
          # wrangler's failure stops the deployment: through tee alone, its refused cron triggers
          # passed unseen (2026-10-07). The Worker's secrets leave the runner however it ends.
          set -o pipefail
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          overrides=()
          if [ -n "$WHOP_ENV" ]; then overrides+=(--var "WHOP_ENV:$WHOP_ENV"); fi
          if [ -n "$WHOP_APP_ID" ]; then overrides+=(--var "WHOP_APP_ID:$WHOP_APP_ID"); fi
          if [ -n "$OPERATOR_COMPANY_ID" ]; then
            overrides+=(--var "OPERATOR_COMPANY_ID:$OPERATOR_COMPANY_ID")
          fi
          if [ "$STAYPUT_TARGET" = production ]; then overrides+=(--name stayput-app); fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" "${overrides[@]}" |
            tee "$RUNNER_TEMP/deploy.log"

      # The Worker's cron triggers as Cloudflare holds them, read back
      # (scripts/deploy/check-crons.ts): its free plan allows 5 per account, shared by the
      # sandbox's Worker and production's. Also after a failed publication, to say why.
      - name: Read the Worker's cron triggers back from Cloudflare
        if: ${{ !cancelled() && steps.publish.outcome != 'skipped' }}
        run: npx tsx scripts/deploy/check-crons.ts apps/worker/wrangler.toml

      # A new workers.dev address can answer 404 "error code: 1042", then nothing, before requests
      # reach the Worker (about 8 minutes for StayPut's first deployment): keep asking for up to 3
      # minutes, then re-run the workflow if the address is still coming up.
      - name: Check the deployed Worker
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then
            echo "::error::wrangler printed no workers.dev address"
            exit 1
          fi
          echo "StayPut: $url"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"
          body_file="$RUNNER_TEMP/health.json"
          headers_file="$RUNNER_TEMP/health.headers"
          for attempt in $(seq 1 18); do
            rm -f "$body_file" "$headers_file"
            code=$(curl -sS -D "$headers_file" -o "$body_file" -w '%{http_code}' --max-time 15 \
              "$url/health") || true
            body=$(cat "$body_file" 2>/dev/null || true)
            echo "Attempt $attempt: HTTP $code $body"
            if grep -q '"status":"ok"' "$body_file" 2>/dev/null; then
              break
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          # Where Cloudflare ran the Worker (wrangler.toml, [placement]): « remote-… » when it
          # was moved next to the database, « local-… » when it ran where the request came in.
          placement=$(grep -i '^cf-placement:' "$headers_file" 2>/dev/null | tr -d '\r' || true)
          echo "Placement: ${placement:-no cf-placement header}"
          {
            echo "### StayPut"
            echo ""
            echo "- URL: $url"
            echo "- /health: HTTP $code \`$body\`"
            echo "- Placement: ${placement:-no cf-placement header}"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '"status":"ok"' "$body_file"

      # Whop's frame loads StayPut through the app's own address on Whop: in production, /health
      # is asked that way, and Whop's « App Base URL not set » stops here, with what to type
      # (scripts/deploy/check-app.ts). The base URL is compared too when Whop shows it.
      - name: Reach StayPut through Whop
        env:
          WHOP_API_KEY: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_API_KEY' || 'WHOP_API_KEY'] }}
          WHOP_ENV: ${{ inputs.target == 'production' && 'production' || vars.WHOP_ENV }}
          WHOP_APP_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_WHOP_APP_ID' || 'WHOP_APP_ID'] }}
          STAYPUT_URL: ${{ vars[inputs.target == 'production' && 'PRODUCTION_STAYPUT_URL' || 'STAYPUT_URL'] }}
        run: npx tsx scripts/deploy/check-app.ts reach apps/worker/wrangler.toml "$WORKER_URL"

      # The optional modules: Discord and Telegram say whether they accept the bots' secrets, and
      # what a creator still relies on (the redirect, privacy mode, the webhook). Warnings only: a
      # module never holds a deployment back.
      - name: Ask Discord and Telegram whether they accept the bots
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_TELEGRAM_BOT_TOKEN' || 'TELEGRAM_BOT_TOKEN'] }}
        run: npx tsx scripts/deploy/check-bots.ts "$WORKER_URL"
