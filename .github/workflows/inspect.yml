name: Inspect

# Started by hand (GitHub -> Actions -> Inspect -> Run workflow) or by Claude through the API:
# what the database holds, as counts only (scripts/ops/inspect.ts), which permissions Whop
# grants the app's key (scripts/ops/whop-permissions.ts), how Telegram sees the connected
# groups (scripts/ops/telegram-groups.ts), what a browser gets from the deployed Worker, and
# how it answers what no browser of a creator or a member sends (scripts/ops/probe.ts).
# It changes nothing. On production (`target`), only what the browser gets and the attack from
# outside: this repository is public, and so are its runs' logs, where no creator's community
# may show.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Which deployment to look at
        type: choice
        options: [sandbox, production]
        default: sandbox

permissions:
  contents: read

env:
  # The deployed Worker: STAYPUT_URL (PRODUCTION_STAYPUT_URL for production) when it has an
  # address of its own, else the one wrangler gave it.
  DEFAULT_URL: ${{ inputs.target == 'production' && 'https://stayput-app.chezbenz18.workers.dev' || 'https://stayput.chezbenz18.workers.dev' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ inputs.target || 'sandbox' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Read the database (counts only, nothing personal)
        if: ${{ (inputs.target || 'sandbox') == 'sandbox' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx tsx scripts/ops/inspect.ts
      - name: Ask Whop which permissions the app key has (never prints the key)
        if: ${{ (inputs.target || 'sandbox') == 'sandbox' }}
        env:
          WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
          WHOP_ENV: ${{ vars.WHOP_ENV }}
        run: npx tsx scripts/ops/whop-permissions.ts
      - name: Ask Telegram about the connected groups (never prints the token, a name or an id)
        if: ${{ (inputs.target || 'sandbox') == 'sandbox' }}
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npx tsx scripts/ops/telegram-groups.ts

      # The deployed Worker attacked from outside (scripts/ops/probe.ts): no token, forged tokens
      # and cookies, forged and replayed webhooks, bodies too large, another site's origin, the
      # headers, the files never served. One verdict per check: never a body, a token or a secret.
      - name: Attack the deployed Worker from outside (verdicts only)
        if: always()
        env:
          STAYPUT_URL: ${{ vars[inputs.target == 'production' && 'PRODUCTION_STAYPUT_URL' || 'STAYPUT_URL'] || env.DEFAULT_URL }}
          WHOP_APP_ID: ${{ vars[inputs.target == 'production' && 'PRODUCTION_WHOP_APP_ID' || 'WHOP_APP_ID'] }}
          WHOP_WEBHOOK_SECRET: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_WHOP_WEBHOOK_SECRET' || 'WHOP_WEBHOOK_SECRET'] }}
        run: npx tsx scripts/ops/probe.ts

      # Satoshi is downloaded at deployment, never committed (scripts/deploy/satoshi.ts): what
      # Fontshare's package holds, its license, and the fingerprint of the font served.
      - name: Read Fontshare's Satoshi package (files, license, fingerprint)
        if: always()
        run: npx tsx scripts/deploy/satoshi.ts "$RUNNER_TEMP/satoshi" --report

      # What a browser gets from the deployed Worker, on the frame relay's path too: a view's
      # page, its script, the relay itself, and /api without a token (refused, as it must be).
      - name: Ask the deployed Worker for the site
        if: always()
        env:
          STAYPUT_URL: ${{ vars[inputs.target == 'production' && 'PRODUCTION_STAYPUT_URL' || 'STAYPUT_URL'] || env.DEFAULT_URL }}
        run: |
          body="$RUNNER_TEMP/body"
          failed=0
          expect() {
            local path=$1 code=$2 type=$3 got mark=ok
            rm -f "$body"
            got=$(curl -sS -o "$body" -w '%{http_code} %{content_type} %{size_download}' \
              --max-time 20 "$STAYPUT_URL$path") || got="000 - 0"
            if [[ "${got%% *}" != "$code" || "$got" != *"$type"* ]]; then mark=FAILED; failed=1; fi
            echo "- \`$path\`: $got ($mark)" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          echo "### The deployed Worker: $STAYPUT_URL" >> "$GITHUB_STEP_SUMMARY"
          expect /health 200 json
          echo "  \`$(cat "$body" 2>/dev/null)\`" | tee -a "$GITHUB_STEP_SUMMARY"
          expect /dashboard/biz_2whAzkbCRpcGqQ 200 text/html
          script=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' "$body" | head -1 || true)
          if [ -n "$script" ]; then
            expect "$script" 200 javascript
          else
            echo "- no script in the page (FAILED)" | tee -a "$GITHUB_STEP_SUMMARY"
            failed=1
          fi
          expect /experiences/exp_check 200 text/html
          expect /demo 200 text/html
          expect /whop-frame.mjs 200 javascript
          expect /api/creator/biz_2whAzkbCRpcGqQ/session 401 json
          # The badge and its verification page are the Worker's, never the app's (wrangler.toml,
          # run_worker_first): for no community, each says so.
          expect /verify/biz_NoSuchCommunity 404 text/html
          expect /badge/biz_NoSuchCommunity.svg 404 json
          # The legal pages too (SPEC 8.1): the page itself, never the app's index.html.
          for page in privacy terms dpa; do
            expect "/$page?lang=fr" 200 text/html
            if ! grep -q '<p class="draft">' "$body"; then
              echo "  not the legal page (FAILED)" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit $failed

  # The browser tests (apps/web/e2e) on the deployed demo, its fonts loaded as creators get
  # them: the key paths (installation, audit, an action, the member's page, a save attributed);
  # the tour and every « Show me » light their place wholly, the tooltip beside it, in
  # English and French, at 1280×720 and 1024×768; the members' search keeps every key and finds
  # Hugo Bernard alone; a member's drawer stands wholly in the window at 1024 and 1440 px; a
  # « Needs attention » row shows its actions only when hovered. No secret, no write.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target || 'sandbox' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the browser tests on the deployed demo in Chrome
        env:
          STAYPUT_URL: ${{ vars[inputs.target == 'production' && 'PRODUCTION_STAYPUT_URL' || 'STAYPUT_URL'] || env.DEFAULT_URL }}
        run: npm run e2e

  # The deployed demo in a real browser (scripts/ops/look.mjs, and the App Store screenshots of
  # scripts/ops/store.mjs): whether StayPut's fonts loaded
  # (Satoshi, Geist) and the chart drew its data, and screenshots of the Dashboard. No secret
  # here; its only write is the `screenshots` branch, replaced at each run, where the latest
  # screenshots can be opened on GitHub.
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ inputs.target || 'sandbox' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Look at the deployed demo in Chrome
        env:
          STAYPUT_URL: ${{ vars[inputs.target == 'production' && 'PRODUCTION_STAYPUT_URL' || 'STAYPUT_URL'] || env.DEFAULT_URL }}
        run: |
          work="$RUNNER_TEMP/look"
          mkdir -p "$work/out"
          cp scripts/ops/look.mjs scripts/ops/store.mjs "$work/"
          cd "$work"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright-core@1.63.0 > /dev/null
          status=0
          node look.mjs "$STAYPUT_URL" out || status=$?
          # The App Store listing's five screenshots (docs/app-store.md), in StayPut's own fonts.
          node store.mjs "$STAYPUT_URL" out/store || status=$?
          {
            echo "### The deployed demo in Chrome"
            echo ""
            echo '```json'
            cat out/report.json 2>/dev/null || echo '{ "error": "no report: see the log" }'
            echo '```'
            echo "### The App Store screenshots"
            echo ""
            echo '```json'
            cat out/store/store.json 2>/dev/null || echo '{ "error": "no report: see the log" }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Production's on their own branch, « screenshots-production ».
      - name: Keep the screenshots on the screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.target == 'production' && 'screenshots-production' || 'screenshots' }}
        run: |
          cd "$RUNNER_TEMP/look/out" || exit 0
          printf '%s\n' "# Screenshots of the deployed demo" "" \
            "Taken by the Inspect workflow (scripts/ops/look.mjs) from commit $GITHUB_SHA." \
            "Replaced at each run." > README.md
          git init -q
          git checkout -q -b "$BRANCH"
          git add .
          git -c user.name='StayPut Inspect' -c user.email='inspect@users.noreply.github.com' \
            commit -q -m "Screenshots of the deployed demo ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$BRANCH"
