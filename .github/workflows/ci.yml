name: CI

on:
  push:
    branches: [main]
  pull_request:

# The token GitHub gives the run reads the code, and writes nothing on GitHub.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Typecheck, lint, format and every test (PGlite: no database service needed).
      - run: npm run check
      # The frontend build, then the Worker bundle exactly as `wrangler deploy` would upload it.
      - run: npm run build
      - run: npm run bundle -w @stayput/worker
      # The build in the runner's Chrome (apps/web/e2e): the key paths (installation, audit, an
      # action, the member's page, a save attributed); the tour and every « Show me » light their
      # place wholly, the tooltip beside it, in English and French, at 1280×720 and 1024×768; the
      # members' search, a member's drawer at 1024 and 1440 px, the rows' hover actions.
      - run: npm run e2e
